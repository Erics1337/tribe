name: Verify Tribe
on:
  push:
    branches: [main, rebuild/expo-neon]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tribe
          POSTGRES_PASSWORD: local-tribe
          POSTGRES_DB: tribe_test
        ports: ['54328:5432']
        options: >-
          --health-cmd 'pg_isready -U tribe'
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm --filter @tribe/mobile export
      - run: |
          node scripts/setup-local.mjs
          PGPASSWORD=local-tribe psql -h localhost -p 54328 -U tribe -d tribe_test -c 'CREATE DATABASE tribe'
          pnpm db:migrate:local
          pnpm dev:seed
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
