services:
  postgres:
    image: postgres:17-alpine
    ports: ['54328:5432']
    environment:
      POSTGRES_USER: tribe
      POSTGRES_PASSWORD: local-tribe
      POSTGRES_DB: tribe
    volumes: ['tribe-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tribe']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  tribe-postgres:
